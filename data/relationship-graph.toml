# Relationship graph data for the dossier's Cytoscape.js visualization
# (templates/dossier.html, rendered by assets/js/modules/relationship-graph.js).
#
# This is dossier content, not decoration: every label is a claim about
# real people and must follow the same sourcing discipline as the rest of
# the dossier (see AGENTS.md). It was moved here verbatim from what was
# previously an inline JS literal in templates/dossier.html — no label,
# node, or edge was added, removed, or reworded in that move. Any future
# edit to this file is a content edit and falls under AGENTS.md's rules,
# not just a presentation change.
#
# `kind` (nodes) / `status` (edges) drive the Cytoscape style classes in
# assets/js/modules/relationship-graph.js. `status` uses the same
# fact/disputed/quote vocabulary as the rest of the site.
# Referential integrity (every edge.source/target resolves to a real node
# id, no duplicate node ids) is enforced by scripts/dossier/validate-graph.mjs.

