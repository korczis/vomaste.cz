# Syntetická cvičná data pro Bootcamp a Akademii.
#
# ZÁVAZNÉ: všechno tady je VYMYŠLENÉ.
# ---------------------------------------------------------------------------
# Ani jedna osoba, obec, instituce, kauza, zpravodajský server ani URL v tomhle
# souboru neexistuje. Je to schválně: výuka nesmí být zadními vrátky
# k rozšíření rozsahu projektu (AGENTS.md, autorizační log), a simulovat
# obvinění konkrétního reálného člověka kvůli cvičení by bylo horší než
# neučit vůbec.
#
# Proto tu platí tři pravidla, která hlídá `validate-learning.mjs`:
#   1. Každý subjekt má `synthetic = true`. Bez toho záznam neprojde.
#   2. Domény cvičných URL musí být z rezervovaného jmenného prostoru
#      (`.example`, `example.com/…`) — RFC 2606 je vyhrazuje přesně na tohle,
#      takže cvičný odkaz nemůže omylem trefit cizí web.
#   3. Nic odsud se nesmí objevit v `data/dossiers/**`. Cvičný dossier
#      neexistuje a existovat nebude; cvičení pracují s tímhle souborem,
#      ne s publikovaným datasetem.
#
# Šablony vykreslují cvičná data přes `templates/components/cvicna_data.html`, který
# vždycky přidá viditelné označení „FIKTIVNÍ / CVIČNÁ DATA“. Cvičný záznam se
# tedy nikde nemůže zobrazit tak, aby vypadal jako publikovaný.

