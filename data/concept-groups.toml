# Groups for content/koncepty/*. Each concept page declares its group id in
# `extra.group`; templates/concepts-index.html and templates/index.html loop
# over the groups here instead of hardcoding section order or labels, and
# templates/concept.html uses the label for its breadcrumb chip and the
# "siblings in this group" nav.
#
# `id` must match `extra.group` in the concept pages — scripts/dossier/
# validate-concepts.mjs fails the build on a group with no pages, a page with
# an unknown group, and on a landing tile whose text is missing.

[[groups]]
id = "identita"
label = "Co to je a co to není"
lead = "Vymezení projektu — pozitivní i negativní, obojí závazné."
order = 10
icon = "M12 2 3 6v6c0 5 3.8 9.2 9 10 5.2-.8 9-5 9-10V6l-9-4Z M9.5 12.5l2 2 4-4"

[[groups]]
id = "model"
label = "Datový model"
lead = "Čtyři provázané registry, na kterých stojí každý dossier. Každý záznam má vlastní ID a vlastní stránku."
order = 20
icon = "M4 7h6v6H4z M14 7h6v6h-6z M7 13v4h10v-4 M12 17v3"

