# ---------------------------------------------------------------------------
# Audience
# ---------------------------------------------------------------------------
# Lekce deklaruje `extra.audience = ["…"]`. Slouží k filtrování v Akademii
# a k odznaku na kartě lekce — ne k omezení přístupu. Všechno je veřejné;
# odznak jen říká „tohle je psané pro tebe“, ne „sem nesmíš“.

[[audiences]]
id = "ctenar"
label = "Čtenář"
order = 10
lead = "Chci webu rozumět a umět si tvrzení ověřit."

[[audiences]]
id = "zdroje"
label = "Dodavatel zdrojů"
order = 20
lead = "Chci posílat veřejné zdroje k existujícím tvrzením."

[[audiences]]
id = "research"
label = "Rešeršista"
order = 30
lead = "Chci připravovat podklady, které editor ověří a použije."

[[audiences]]
id = "editor"
label = "Editor"
order = 40
lead = "Chci kontrolovat obsah před publikací."

[[audiences]]
id = "vyvojar"
label = "Vývojář"
order = 50
lead = "Chci měnit kód, data nebo šablony."

[[audiences]]
