# Vzdělávací vrstva: sekce, úrovně, audience, cesty a kategorie příručky.
#
# Proč tenhle soubor existuje a co do něj NEPATŘÍ
# -----------------------------------------------
# Stejný vztah jako `data/concept-groups.toml` ke `content/koncepty/*`:
# tady je struktura (pořadí, popisky, ikony, prerekvizity), v jednotlivých
# stránkách je obsah. Šablony `learning-*.html` a generátor navigace
# (`scripts/dossier/build-navigation.mjs`) čtou tenhle soubor místo aby
# pořadí sekcí nebo názvy úrovní držely natvrdo v markupu.
#
# Co tu NENÍ a nikdy nesmí být:
#   * definice pojmů — kanonické jsou stránky `content/koncepty/*`.
#     Vzdělávací vrstva na ně odkazuje, nikdy je nepřepisuje. Druhá
#     definice slova „sporné“ nebo „nezávislé doložení“ je drift, ne
#     didaktika (AGENTS.md, pravidlo dvou reprezentací).
#   * počty lekcí — počítají se ze stránek, které opravdu existují.
#   * jakýkoli reálný subjekt, kauza nebo tvrzení. Cvičení běží výhradně
#     na syntetických datech (`data/learning-fixtures.toml`), protože
#     výuka nesmí být zadními vrátky k rozšíření rozsahu projektu.
#
# Vynucuje `scripts/dossier/validate-learning.mjs` (součást `npm run build`):
# neznámá sekce, neznámá úroveň, neznámá audience, prerekvizita na
# neexistující lekci, `next` do prázdna, duplicitní `lesson_id`, osiřelá
# lekce nebo odkaz na neexistující stránku příručky shodí build.
#
# `icon` je surová data `<path d="…">` pro 24×24 stroke ikonu, stejná
# konvence jako `data/navigation.toml` — markup ikon nepatří do šablon.

# ---------------------------------------------------------------------------
# Sekce vzdělávací vrstvy
# ---------------------------------------------------------------------------
# Pořadí je zároveň pořadím v postranní navigaci pod položkou „Naučit se“.
# `route` je Zola cesta k indexu sekce; `validate-navigation.mjs` ověří, že
# soubor na disku opravdu existuje.
#
# `nav_children` = vypisovat jednotlivé stránky sekce i v postranní navigaci.
# Akademie a Příručka mají desítky položek; ty patří na vlastní seskupený
# index, ne do stromu, kde by přebily zbytek webu.

