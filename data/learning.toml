label = "Maintainer"
order = 60
lead = "Chci systém rozvíjet, ne jen používat."

# ---------------------------------------------------------------------------
# Úrovně Akademie
# ---------------------------------------------------------------------------
# `code` je prefix identifikátorů lekcí (A1 → A101, A102…). Validátor z něj
# ověřuje, že lekce sedí do úrovně, kterou deklaruje — překlep v `level` se
# jinak projeví až tím, že lekce zmizí z výpisu.

[[levels]]
id = "foundations"
code = "A1"
label = "Základy"
order = 10
lead = "Co je dossier, co je tvrzení, zdroj a mezera — a proč se stavy nikdy neslévají do generického „faktu“."

[[levels]]
id = "research"
code = "A2"
label = "Rešerše"
order = 20
lead = "Jak formulovat atomické tvrzení, hledat doklad, rozlišit primární a převzatý zdroj a poznat skutečně nezávislé potvrzení."

[[levels]]
id = "editorial"
code = "A3"
label = "Redakční práce"
order = 30
lead = "Neutrální formulace, integrita citace, zacházení s obviněním, procesní výsledky, ochrana třetích osob a kontrolní seznam před publikací."

[[levels]]
id = "contribution"
code = "A4"
label = "Příspěvky"
order = 40
lead = "Jak podat opravu, zdroj nebo návrh tvrzení — včetně Gitu pro netechnické lidi a anatomie pull requestu."

[[levels]]
id = "data"
code = "A5"
label = "Datový model"
order = 50
lead = "Kanonické JSON záznamy, JSON-LD, schémata, validace a generované adaptéry."

[[levels]]
id = "engineering"
code = "A6"
label = "Inženýrství"
order = 60
lead = "Architektura repozitáře, lokální vývoj, Zola, šablony, frontend, validační pipeline, testy, CI a nasazení."

[[levels]]
id = "governance"
code = "A7"
label = "Governance"
order = 70
lead = "Autorizační model, append-only historie, redakční politika, evoluce schémat, opravy a reprodukovatelnost."

# Claude Code dostal vlastní kód (C1), ne pokračování řady A: není to
# další stupeň metodiky, je to jiná osa. Člověk, který umí A1–A3, může
# přispívat bez Claude Code úplně; člověk, který projde C1, pořád
# potřebuje metodiku. Sloučit obojí do jedné řady by naznačovalo pořadí,
# které neplatí.
[[levels]]
id = "claude-code"
code = "C1"
label = "Claude Code"
order = 80
lead = "Jak s repozitářem pracovat přes Claude Code — co umí, kde jsou jeho hranice, jak poznat rizikovou operaci a proč jeho výstup není zdroj."

