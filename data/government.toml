# Roster of the current Government of the Czech Republic — a factual public
# record (who holds which office), NOT dossier coverage of anyone.
#
# Every member listed here becomes a global CONTEXT entity page
# (content/entities/<entity_id>.md, publication_role = "context",
# dossier_status = "not_authorized"), generated by
# scripts/dossier/build-government-roster.mjs. That is deliberately the
# weakest possible publication state this repo has:
#
#   * it records a public office, sourced to the official government site;
#   * it carries no claims, no allegations, no controversy, no assessment;
#   * it is explicitly NOT an authorized dossier subject — appearing here
#     never promotes anyone to dossier coverage. Only a new, dated,
#     topic-specific entry in AGENTS.md's append-only authorization log
#     can do that, per subject, and `validate-authorization.mjs` fails the
#     build if a context entity is ever marked dossier_enabled/authorized.
#
# Adding or removing a minister is an edit to THIS FILE plus a re-run of the
# generator — no template, navigation or validator change. Members who leave
# office are not deleted (the roster stays an auditable historical record);
# set `until` instead.
#
# Verified against https://vlada.gov.cz/cz/vlada/clenove-vlady/ on the
# snapshot date below. Re-verify (and bump `verified_at`) before relying on
# it as current.

