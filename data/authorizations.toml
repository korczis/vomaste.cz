scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Marta Nováková je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministryně průmyslu a obchodu (27. 6. 2018 – 30. 4. 2019, druhá vláda Andreje Babiše), dříve prezidentka Svazu obchodu a cestovního ruchu ČR a majitelka U&SLUNO a.s. Její konec v úřadu premiér Babiš doprovodil slovy, že přechod ze soukromého sektoru do veřejné správy není snadný, a výslovně odmítl, že by důvodem byl incident s tchajwanskou zástupkyní (Seznam Zprávy 2019-04-10); nahradil ji Karel Havlíček. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností konce v úřadu tak, jak je popsaly citované zdroje — důvody se připisují tomu, kdo je vyslovil. Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

