scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Jan Blatný je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr zdravotnictví (29. 10. 2020 – 7. 4. 2021, druhá vláda Andreje Babiše), dětský hematolog FN Brno a docent Masarykovy univerzity. Jeho odvolání podle Tiscali/Zpráv provázel dříve veřejně vyslovený požadavek prezidenta Zemana kvůli Blatného postoji k vakcíně Sputnik V (trval na schválení EMA); Blatný odvolání označil za politické rozhodnutí a uvedl, že má čisté svědomí — obě strany se citují atribuovaně. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností odvolání tak, jak je popsaly citované zdroje — odvolání je politický krok a žádné pochybení se z něj nevyvozuje. Doloženo přímo otevřenými zdroji (vlada.gov.cz, zpravy.tiscali.cz). Hlubší rešerše vyžaduje samostatnou budoucí autorizaci."

