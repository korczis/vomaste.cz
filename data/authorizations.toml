scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Miroslav Toman je politicky exponovaná osoba v souvislosti s výkonem dřívějších veřejných funkcí — ministr zemědělství (27. 6. 2018 – 17. 12. 2021, druhá vláda Andreje Babiše, nominován za ČSSD; v demisi od 11. 11. 2021) a ministr zemědělství i v letech 2013–2014 (vláda Jiřího Rusnoka); dříve prezident Potravinářské komory ČR a Agrární komory ČR a náměstek ministra zemědělství. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: pouze základní biografický záznam dřívějších veřejných funkcí. Tvrzení zatím nese stav 1 ZDROJ: jediný přímo otevřený zdroj je oficiální vládní profil (nezávislé redakce k tématu vracejí automatizovanému přístupu 403 nebo článek už není dostupný); povýšení na CORROBORATED vyžaduje otevření druhého, nezávislého zdroje. Nejde o investigativní rešerši žádné kauzy (vč. podnikání rodiny Tomanových) — to by vyžadovalo samostatnou budoucí autorizaci."

[[authorizations]]
