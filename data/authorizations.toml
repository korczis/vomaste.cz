scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Taťána Malá je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministryně spravedlnosti (27. 6. – 10. 7. 2018, druhá vláda Andreje Babiše, ANO), poslankyně od října 2017, dříve místopředsedkyně hejtmana Jihomoravského kraje. Po 13 dnech ve funkci rezignovala v souvislosti s mediálně popsaným podezřením z plagiátorství jejích diplomových prací; sama uvedla, že se ničeho nedopustila, a její vyjádření se cituje jejími slovy (Blesk 2018-07-09). Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností rezignace tak, jak je popsaly citované zdroje. **Povinné rámování při každé zmínce:** jde o mediálně popsané podezření, nikoli o soudní či akademický verdikt doložený citovaným zdrojem; její popření se uvádí vždy. Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

