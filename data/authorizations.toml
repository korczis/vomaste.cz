scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Lubomír Zaorálek je politicky exponovaná osoba v souvislosti s výkonem dřívějších veřejných funkcí — ministr kultury (27. 8. 2019 – 17. 12. 2021, druhá vláda Andreje Babiše, v demisi od 11. 11. 2021), ministr zahraničních věcí (2014–2017), předseda Poslanecké sněmovny (2002–2006), dlouholetý poslanec a místopředseda ČSSD; podle ČT24 byl 5. 10. 2024 zvolen statutárním místopředsedou SOCDEM (100 ze 135 hlasů). Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: pouze základní biografický záznam dřívějších veřejných a stranických funkcí, doložený přímo otevřenými zdroji (vlada.gov.cz, ČT24). Nejde o investigativní rešerši žádné kauzy z jeho ministerského působení — to by vyžadovalo samostatnou budoucí autorizaci."

[[authorizations]]
id = "AUTH-2026-08-08-TOMAS-PETRICEK"
