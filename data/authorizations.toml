scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Jan Kněžínek je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr spravedlnosti (10. 7. 2018 – 30. 4. 2019, druhá vláda Andreje Babiše, nestraník), dlouholetý legislativec Úřadu vlády (2007–2018, náměstek pro řízení sekce Legislativní rady vlády). Demisi podal v dubnu 2019 bez bližšího zdůvodnění; opoziční spekulace o souvislosti s vývojem kauzy Čapí hnízdo jsou v citovaném zdroji připsány opozici a nic víc z nich neplyne (ČT24 2019-04-18). Nahradila ho Marie Benešová. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností demise tak, jak je popsaly citované zdroje — demise je jeho rozhodnutí, spekulace zůstávají připsané těm, kdo je vyslovili. Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

