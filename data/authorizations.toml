scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Petr Krčál je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr práce a sociálních věcí (27. 6. – 18. 7. 2018, druhá vláda Andreje Babiše, ČSSD), dříve radní Kraje Vysočina a náměstek na Úřadu vlády. Po zhruba třech týdnech rezignoval v souvislosti se zjištěními Seznam Zpráv o shodách v jeho bakalářské práci; jeho vlastní vyjádření (připustil možné nedostatky, zmínil i zdravotní důvody) se cituje jeho slovy (Hospodářské noviny 2018-07-17). Nahradila ho Jana Maláčová. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností rezignace tak, jak je popsaly citované zdroje. **Povinné rámování:** jde o mediálně popsaná zjištění a jeho rezignaci, nikoli o soudní či akademický verdikt doložený citovaným zdrojem. Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

