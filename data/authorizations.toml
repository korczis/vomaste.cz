scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Tomáš Petříček je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr zahraničních věcí (16. 10. 2018 – 12. 4. 2021, druhá vláda Andreje Babiše, ČSSD). O odvolání se podle Aktuálně.cz dozvěděl na schůzce s předsedou ČSSD Janem Hamáčkem po neúspěšné kandidatuře na předsedu strany; odvolání je politický krok, jeho vlastní interpretace (postoj k tendru na Dukovany, k neschváleným vakcínám) se cituje atribuovaně. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: pouze základní biografický záznam dřívější vládní funkce a okolností odvolání tak, jak je popsaly citované zdroje. Doloženo přímo otevřenými zdroji (vlada.gov.cz, Aktuálně.cz). Nejde o investigativní rešerši žádné kauzy — to by vyžadovalo samostatnou budoucí autorizaci."

[[authorizations]]
