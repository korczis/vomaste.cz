scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Pavel Blažek je politicky exponovaná osoba v souvislosti s výkonem dřívějších veřejných funkcí — ministr spravedlnosti (17. 12. 2021 – 9. 6. 2025, vláda Petra Fialy, ODS) a ministr spravedlnosti i v letech 2012–2013 (vláda Petra Nečase), dlouholetý poslanec (od 2013). Demisi oznámil 30. 5. 2025 v souvislosti s bitcoinovou kauzou ministerstva spravedlnosti (dar bitcoinů od Tomáše Jiříkovského a jejich prodej ministerstvem); sám uvedl, že si není vědom žádného protiprávního jednání a nechce poškozovat pověst vlády a koalice — obojí se cituje jeho slovy (ČT24 2025-05-30). Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívějších vládních funkcí a okolností demise tak, jak je popsaly citované zdroje. **Povinné rámování při každé zmínce:** demise je politický krok, Blažek podle citovaných zdrojů není obviněn, jeho vyjádření se uvádí vždy; samotná bitcoinová kauza je v tomto repozitáři pokryta samostatně (dossier Jeronýma Tejce) a tento dossier ji nerozšiřuje. Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

