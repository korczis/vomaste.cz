scope_summary = "Ruší dřívější omezení AUTH-2026-08-05-MARTIN-PAVLIK na čtyři jmenovité subjekty a šest tvrzení. Dossier smí pokrývat jakoukoli veřejně doloženou rejstříkovou, spolkovou a veřejnopeněžní stopu osoby vymezené stejnou identitní kotvou (podnikatel.cz profil 1902710 + ARES VR): doplňkové rejstříkové zápisy, řádně dopočítaný objem smluv v Registru smluv za všechny čtyři subjekty, veřejně publikované účetní závěrky ve Sbírce listin, a listinné doklady jako silnější/nezávislejší zdroj oproti sdílené rodině ARES+Podnikatel.cz. Beze změny zůstávají strukturální pravidla projektu: žádný IT profesní profil, schopnosti, zaměstnání, věk, datum narození, adresa bydliště; žádné sloučení s jinou osobou stejného jména bez listinného ověření; funkce/podíl/smlouva zůstává evidenční fakt, nikdy podezření."

