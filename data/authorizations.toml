scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Jakub Kulhánek je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr zahraničních věcí (od 21. 4. 2021 do 17. 12. 2021, druhá vláda Andreje Babiše, ČSSD; v demisi od 11. 11. 2021), předtím náměstek na ministerstvech vnitra (2018–2021), zahraničí (2014–2016) a obrany (2014). Jmenován byl v době kauzy Vrbětice a mezi jeho první kroky patřilo předání protestu ruskému velvyslanci (Blesk 2021-04-21). Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívějších veřejných funkcí, doložený přímo otevřenými zdroji (vlada.gov.cz, Blesk.cz). Dřívější externí poradenství pro CEFC Europe je zmíněno pouze jako citovaným zdrojem uvedený fakt s kritikou připsanou kritikům, nikoli jako vlastní hodnocení webu. Hlubší rešerše vyžaduje samostatnou budoucí autorizaci."

