scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Petr Arenberger je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr zdravotnictví (7. 4. – 25. 5. 2021, druhá vláda Andreje Babiše), ředitel FN Královské Vinohrady a přednosta dermatovenerologické kliniky 3. LF UK. Rezignoval poté, co Seznam Zprávy popsaly nesrovnalosti v jeho majetkových přiznáních (nepřiznané nemovitosti, příjmy z klinických studií); sám uvedl, že přiznání vyplnil nesprávně, ale daně platí poctivě, a dění označil za „mediální lynč\" — obojí se cituje jeho slovy (Seznam Zprávy 2021-05-25). Nahradil ho Adam Vojtěch. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností rezignace tak, jak je popsaly citované zdroje. **Povinné rámování při každé zmínce:** popsané nesrovnalosti jsou zjištění citované redakce a jeho přiznaná chyba ve vyplnění, nikoli soudní či správní verdikt; jeho obhajoba se uvádí vždy. Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

