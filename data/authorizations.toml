agents_md_section = "Scope extension, 2026-08-08: Roman Prymula"
scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Roman Prymula je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr zdravotnictví (21. 9. – 29. 10. 2020, druhá vláda Andreje Babiše), předtím náměstek ministra zdravotnictví (2017–2020), epidemiolog. Konec v úřadu následoval poté, co byl v říjnu 2020 vyfotografován při nočním odchodu z pražské restaurace v době, kdy restaurace musely být podle protiepidemických opatření zavřené; premiér Babiš ho poté vyzval k rezignaci a navrhl prezidentovi jeho odvolání (RESPEKT 2020-10-23). Prymulova vlastní obhajoba („zas tolik jsem toho neprovedl\", tvrzení, že nic neporušil) se cituje jeho slovy. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností jejího konce tak, jak je popsaly citované zdroje — odvolání je politický krok premiéra, nikoli soudní ani správní závěr o porušení pravidel, a Prymulovo popření se uvádí při každé zmínce. Doloženo přímo otevřenými zdroji (vlada.gov.cz, RESPEKT). Hlubší rešerše vyžaduje samostatnou budoucí autorizaci."

[[authorizations]]
