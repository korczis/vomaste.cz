scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): František Koudela je veřejný funkcionář — starosta města Znojma (ODS), zvolený zastupitelstvem 5. 8. 2024 po odvolání dosavadní starostky, dříve ředitel organizace Znojemská Beseda. Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt celé znojemské zastupitelstvo a navázané kauzy.  Rozsah: aktuální mandát a funkce starosty dle oficiálního webu města (znojmocity.cz, přímo otevřeno) a ČT24/ČTK (přímo otevřeno); okolnosti změny vedení radnice v srpnu 2024; jeho citovaná reakce na tvrzení hnutí ANO o nabídkách úplatků koaličním zastupitelům (červenec 2024) — tvrzení o úplatcích jsou výhradně atribuovaná tvrzení stran sporu, nikdo nebyl obviněn a nic z nich se nepřijímá za závěr webu (gate 4). Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

