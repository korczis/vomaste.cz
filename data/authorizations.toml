scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Antonín Staněk je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr kultury (27. 6. 2018 – 31. 7. 2019, druhá vláda Andreje Babiše, ČSSD), dříve primátor Olomouce (od 2014) a poslanec (od 2017). Jeho odvolání předcházel spor o odvolání ředitele Národní galerie Praha Jiřího Fajta a ředitele Muzea umění Olomouc, kritika odborné veřejnosti a žádost ČSSD o jeho konec; prezident Zeman jeho květnovou rezignaci nejprve nepřijal a odvolal ho k 31. 7. 2019 (Aktuálně.cz 2019-07-29). Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce a okolností odvolání tak, jak je popsaly citované zdroje — kritika je připsána kritikům, prezidentova protichůdná interpretace (poděkování za „odhalení zneužívání veřejných prostředků\") jemu, a web žádnou stranu nepřijímá za svou. Rozšíření rozsahu vyžaduje samostatnou budoucí autorizaci."

