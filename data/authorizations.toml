scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): rozšíření na jedno téma ministerského období 2021-2025 — krize s výpadky léků 2022-2023: opoziční kritika vč. výzev k rezignaci, jeho publikovaná vyjádření a sliby, vládní novela o léčivech a opoziční kritika její dostatečnosti (Seznam Zprávy 10. 5. 2023, ČT24 29. 8. 2023, oba přímo otevřeny). Výpadky byly celoevropský jev; kritika i obhajoba se citují jako pozice, žádné protiprávní jednání se netvrdí ani nenaznačuje. Jiná témata (SÚKL, VZP) nepokryta."

