scope_summary = "Standing scope (AUTH-2026-08-05-PLATFORM-SCOPE): Vladimír Kremlík je politicky exponovaná osoba v souvislosti s výkonem dřívější veřejné funkce — ministr dopravy (29. 4. 2019 – 23. 1. 2020, druhá vláda Andreje Babiše), dříve náměstek Úřadu pro zastupování státu ve věcech majetkových a advokát. Při ohlášení nominace ho premiér Babiš popsal jako profesionála s bezpečnostní prověrkou na stupeň „tajné\" (Seznam Zprávy 2019-04-10). Autorizace navazuje na výslovnou žádost vlastníka v této konverzaci pokrýt vládní představitele posledních tří volebních období, po pěti postupně.  Rozsah tohoto dossieru je záměrně minimální: základní biografický záznam dřívější vládní funkce s daty z oficiálního profilu, doložený přímo otevřenými zdroji (vlada.gov.cz, Seznam Zprávy). Nejde o investigativní rešerši žádné kauzy (vč. okolností jeho odvolání kolem zakázky na e-shop dálničních známek — bez přímo otevřeného zdroje se zde neuvádí) — to by vyžadovalo samostatnou budoucí autorizaci."

