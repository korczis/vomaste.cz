# Primary navigation, shared by the mobile bottom-nav and the desktop
# sidebar in templates/base.html. `match_prefix` drives active-state
# detection: the item with the longest current_path-matching prefix wins,
# so /dossiers/petr-macinka/sources/... highlights "Zdroje" under Petr
# Macinka, not the top-level "Dossiery" catalog link. "/" is special-cased
# in the template to require an exact match.
#
# Items with a `group` are rendered indented, as children of the most
# recent non-grouped item above them in `order` — that's how the two
# entity-dossier trees (Petr Macinka, Filip Turek) are expressed here.
# See AGENTS.md's "Entity dossiers vs. the aggregate view": the aggregate
# dossier (macinka-turek) is deliberately NOT one of these two trees and
# has no children of its own here — it gets exactly one, ungrouped,
# clearly-labeled link placed after both person trees, so it can never be
# mistaken for a third equal dossier. scripts/dossier/validate-navigation.mjs
# enforces this at build time.
#
# `icon` is raw SVG <path d="..."> data for a 24x24 stroke-based icon
# (viewBox 0 0 24 24), rendered inside a shared <svg> wrapper in the
# template — keeping icon markup out of this data file.

[[items]]
id = "home"
label = "Domů"
path = "@/_index.md"
match_prefix = "/"
order = 10
icon = "M3 10.5 12 3l9 7.5 M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"

[[items]]
id = "dossiers"
label = "Dossiery"
path = "@/dossiers/_index.md"
match_prefix = "/dossiers/"
order = 15
icon = "M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"

[[items]]
