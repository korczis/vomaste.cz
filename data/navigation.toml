# Static navigation SKELETON. This file deliberately contains **no dossier**:
# no slug, no person, no per-dossier registry item. The dossier subtree under
# the "dossiers" item is generated at build time by
# scripts/dossier/build-navigation.mjs from data/dossiers.toml plus whatever
# registry sections actually exist on disk, and written to
# data/generated/navigation.json — which is what templates/base.html renders.
#
# Consequences, enforced by scripts/dossier/validate-navigation.mjs:
#   * a person is NEVER a top-level sidebar item — every dossier hangs under
#     "Dossiery" as a subtree, entity dossiers first, aggregate views last and
#     labelled as such;
#   * adding, renaming or removing a dossier or one of its registries requires
#     no edit here — the tree follows the data;
#   * an aggregate dossier never gets its own expandable subtree (see
#     AGENTS.md, "Entity dossiers vs. the aggregate view").
#
# `icon` is raw SVG <path d="..."> data for a 24x24 stroke-based icon
# (viewBox 0 0 24 24), rendered inside a shared <svg> wrapper in the template —
# keeping icon markup out of the templates.
#
# `count_metric` names a metric in scripts/data/navigation-metrics.registry.mjs;
# the VALUE never lives here. Resolved at build time from
# data/generated/navigation-metrics.json. An item without it gets no badge.
# `count_noun` is used only for the accessible label, never rendered visibly.
#
# `match_prefix` drives active-state detection: the deepest matching prefix in
# the whole generated tree wins, so /dossiers/petr-macinka/sources/... marks
# "Zdroje" under Petr Macinka, not the top-level "Dossiery". "/" is
# special-cased in the template to require an exact match.

[[items]]
id = "home"
label = "Domů"
path = "@/_index.md"
match_prefix = "/"
order = 10
icon = "M3 10.5 12 3l9 7.5 M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"

# The dossier subtree is attached to this item by the generator.
[[items]]
id = "dossiers"
label = "Dossiery"
path = "@/dossiers/_index.md"
match_prefix = "/dossiers/"
order = 15
icon = "M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"
count_metric = "dossiers.total"
count_noun = "dossierů"

[[items]]
id = "entities"
label = "Entity"
path = "@/entities/_index.md"
match_prefix = "/entities/"
order = 16
icon = "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21a8 8 0 0 1 16 0"
count_metric = "entities.total"
count_noun = "entit"

[[items]]
id = "map"
label = "Globální mapa"
path = "@/map/_index.md"
match_prefix = "/map/"
order = 17
icon = "M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-.553-.894L15 4m0 13V4m0 0L9 7"
count_metric = "relations.total"
count_noun = "vztahů"

[[items]]
id = "concepts"
