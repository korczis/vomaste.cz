# Primary navigation, shared by the mobile bottom-nav and the desktop
# sidebar in templates/base.html. `match_prefix` drives active-state
# detection: the item with the longest current_path-matching prefix wins,
# so /dossiers/macinka-turek/sources/... highlights "zdroje", not "dossier".
# "/" is special-cased in the template to require an exact match.
#
# Paths are scoped to the "macinka-turek" dossier for now — this is the
# only authorized dossier on the site. If a second dossier is ever
# authorized, this file (not the templates) is what needs a new entry;
# the templates themselves derive their dossier root dynamically from
# each page's own front matter (extra.dossier), never from this file.
#
# `icon` is raw SVG <path d="..."> data for a 24x24 stroke-based icon
# (viewBox 0 0 24 24), rendered inside a shared <svg> wrapper in the
# template — keeping icon markup out of this data file.

[[items]]
id = "home"
label = "Domů"
path = "@/_index.md"
match_prefix = "/"
order = 10
icon = "M3 10.5 12 3l9 7.5 M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"

