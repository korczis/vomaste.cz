# Slovník typů entit.
#
# Šablona registru entit (templates/entities-index.html) potřebuje pro
# skupinu „Typ entity" lidský popisek — a ten se nesmí psát do šablony,
# protože by z něj byla konstanta, kterou nikdo nepřepočítá, až v datech
# přibude nový typ. Zdrojem pravdy o tom, jaké typy existují, zůstává
# front matter stránek entit; tenhle soubor k nim jen doplňuje popisek.
#
# Vynucuje `scripts/dossier/validate-entity-types.mjs` (součást
# `npm run build`): typ použitý v datech musí mít záznam tady a záznam
# tady musí být v datech použitý. Mrtvý ani chybějící překlad tedy
# neprojde buildem.
#
# `label` je název skupiny v množném čísle, jak se zobrazí v hlavičce
# skupiny. `order` řídí pořadí jen tam, kde nerozhoduje počet.

[[types]]
id = "person"
label = "Osoby"
order = 1

