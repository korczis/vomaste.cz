# Relationship graph for the Petr Vencálek dossier. Projection of the
# claim/source registries — every edge carries a CLM-## and SRC-## that
# exist there. Scope is narrow on purpose (AUTH-2026-08-01-VENCALEK).
#
# GMR GAS UA LLC (the Kyjev branch) is deliberately NOT a node here, even
# though CLM-03 mentions it: it is a pure-context entity whose `depth`
# field is shared across every dossier that names it (fixed at 1 by
# data/dossiers/macinka-turek/graph.toml), and this dossier only reaches
# it two hops from the subject (vencalek -> gmrgas-cz -> gmrgas), which
# would force gmrgas to depth 2 here — a global mismatch with its fixed
# depth 1 elsewhere. GMR GAS s.r.o. (gmrgas-cz), one hop from vencalek,
# does not have that conflict — its global depth was moved to 1 (in
# lockstep with macinka-turek/graph.toml) precisely so this direct edge
# is valid. The Ukrainian-branch link itself is fully graphed already in
# macinka-turek/petr-macinka; this dossier's prose cross-links there
# instead of duplicating a second, depth-inconsistent copy.

[[nodes]]
id = "vencalek"
type = "person"
label = "Petr Vencálek"
depth = 0
subject = true
claims = ["CLM-01"]
sources = ["SRC-01", "SRC-02"]

[[nodes]]
id = "gmrgas-cz"
type = "company"
label = "GMR GAS s.r.o. (Brno)"
depth = 1
subject = false
claims = ["CLM-01"]
sources = ["SRC-01", "SRC-02"]

[[edges]]
id = "edge-vencalek-gmrgascz"
source = "vencalek"
target = "gmrgas-cz"
relation = "HOLDS_INTEREST_IN"
label = "jediný společník a jednatel"
status = "corroborated"
claims = ["CLM-01"]
sources = ["SRC-01", "SRC-02"]
