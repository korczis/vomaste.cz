# Relationship graph data model for the dossier's Cytoscape.js
# visualization (templates/dossier.html, assets/js/modules/relationship-graph.js).
#
# This is dossier content, not decoration: every node/edge label is a claim
# about real people/institutions and follows the same sourcing discipline
# as the rest of the dossier (see AGENTS.md). Every factual edge (status
# "corroborated" | "disputed" | "quote") carries at least one CLM-## and
# one SRC-## from the actual registries in content/dossier/_index.md and
# content/dossier/zdroje/ — this file is a *projection* of that registry
# for visualization, not a parallel source of truth. Referential integrity
# (node ids, CLM/SRC/GAP existence, relation-type/node-type compatibility,
# depth-path-to-subject) is enforced by scripts/dossier/validate-graph.mjs.
#
# depth: 0 = the two dossier subjects; 1 = their direct, already-authorized
# context (roles, parties, the four tracked cases); 2 = one further
# authorized level (institutions/companies/persons that appear directly in
# already-cited source coverage of those depth-1 items). Depth expresses
# distance from the subjects in *this* model, not importance or
# credibility — see AGENTS.md's context-node rules for what may appear
# here at all.
#
# status: "corroborated" (independently confirmed), "quote" (a direct
# quote from someone, not this site's assessment), "disputed" (open/
# contested), "contextual" (structural/background fact, e.g. "X is PM" —
# not a claim this dossier is itself asserting or sourcing).

