# Relationship graph for the Richard Chlad dossier. Projection of the
# claim/source registries — every edge carries a CLM-## and SRC-## that
# exist there.
#
# Radovan Krejčíř is deliberately NOT a node. The reported acquaintance
# is an attributed descriptive detail in one profile (CLM-08), it is
# personal and historical rather than financial or political, and his
# coverage was explicitly refused on the record (AGENTS.md, "Not
# authorized: Radovan Krejčíř"). Giving him a graph node would make a
# passing biographical mention look like a mapped relationship.
#
# Depths follow the canonical global entity pages: motoriste is depth 1
# there, so it is depth 1 here — a shared context entity must carry the
# same depth in every graph that names it.

