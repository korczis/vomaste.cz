# Custom doména aktivní od 2026-07-29: Route 53 (zóna Z04329971W28TTV7BWJ0M)
# míří apex A/AAAA na GitHub Pages a www CNAME na korczis.github.io;
# static/CNAME drží doménu při workflow deployi (bez něj by ji Pages
# resetly). get_url() generuje absolutní URL z této hodnoty.
base_url = "https://vomaste.cz"

title = "vomaste.cz"
description = "Otevřený, Git-native systém pro tvorbu a publikaci dohledatelných dossierů ve veřejném zájmu. Tvrzení, zdroje, kauzy a vztahy jako strukturovaná, verzovaná data."

compile_sass = false
build_search_index = false
generate_robots_txt = true
generate_feeds = false

minify_html = true
hard_link_static = false

taxonomies = []

[link_checker]
# irozhlas.cz returns 403 to Zola's link-checker user agent (bot-blocking),
# not because the article is gone — skip automated verification for it.
skip_prefixes = ["https://www.irozhlas.cz/"]

[extra]
locale = "cs_CZ"
lang = "cs"

# Doplněk k <title> na úvodní stránce: samotné „vomaste.cz" ve výsledku
# vyhledávání neřekne, co web je. Podstránky ho nepoužívají — ty mají vlastní
# titulek a název webu jako příponu (templates/base.html, document_title).
title_tagline = "dohledatelné dossiery ve veřejném zájmu"

# Navržená preview karta 1200×630 JPEG (ne screenshot): generuje ji
# scripts/og/build-og-images.mjs, které vyrábí i kartu pro každý dossier
# (images/og/<slug>.jpg — templates/base.html je přiřazuje automaticky).
# LinkedIn/Facebook SVG og:image nevykreslují, proto rastr; starší varianty
# (og-image.svg, og-image.jpg, og-image-square.jpg) zůstávají v repu.
og_image = "images/og/site.jpg"
og_image_width = 1200
og_image_height = 630
og_image_type = "image/jpeg"
og_image_alt = "vomaste.cz — Open Intelligence Commons. Nevěřte autorovi, zkontrolujte data, zdroje a historii změn."
author = "vomaste.cz / korczis"
keywords = "dossier, otevřená data, open source, OSINT, investigativní data, veřejný zájem, transparentnost, ověřitelné zdroje, registr tvrzení, JSON-LD, Git"
# Čtvercová varianta pro platformy preferující 1:1 (WhatsApp, Telegram…):
# static/images/og-image-square.jpg (1200×1200) — stejný vizuál.

seo_type = "WebPage"
og_type = "website"
publisher = "vomaste.cz"

index = true

# Canonical GitHub Issue Form URL (PHASE_006.md §18, PHASE_006.md §42
# Phase 7 contract "data-driven URL, žádný hardcoded duplicate text") —
# every on-site CTA reads this one value via config.extra, never a
# second hardcoded copy of the template query string.
intake_issue_form_url = "https://github.com/korczis/vomaste.cz/issues/new?template=navrh-dossieru.yml"
