# Custom doména aktivní od 2026-07-29: Route 53 (zóna Z04329971W28TTV7BWJ0M)
# míří apex A/AAAA na GitHub Pages a www CNAME na korczis.github.io;
# static/CNAME drží doménu při workflow deployi (bez něj by ji Pages
# resetly). get_url() generuje absolutní URL z této hodnoty.
base_url = "https://vomaste.cz"

title = "vomaste.cz"
description = "Otevřený, Git-native systém pro tvorbu a publikaci dohledatelných dossierů ve veřejném zájmu. Tvrzení, zdroje, kauzy a vztahy jako strukturovaná, verzovaná data."

compile_sass = false
build_search_index = false
generate_robots_txt = true
generate_feeds = false

minify_html = true
hard_link_static = false

taxonomies = []

[link_checker]
# irozhlas.cz returns 403 to Zola's link-checker user agent (bot-blocking),
# not because the article is gone — skip automated verification for it.
skip_prefixes = ["https://www.irozhlas.cz/"]

[extra]
locale = "cs_CZ"
lang = "cs"

# JPEG 1200×630 (ořez z hero ilustrace, static/images/og-image.jpg) —
# LinkedIn/Facebook SVG og:image nevykreslují, proto rastr. Původní SVG
# (images/og-image.svg) zůstává v repu jako zdrojová varianta.
og_image = "images/og-image.jpg"
og_image_width = 1200
og_image_height = 630
og_image_type = "image/jpeg"
og_image_alt = "vomaste.cz — Open Intelligence Commons. Nevěřte autorovi, zkontrolujte data, zdroje a historii změn."
author = "vomaste.cz / korczis"
keywords = "dossier, otevřená data, open source, OSINT, investigativní data, veřejný zájem, transparentnost, ověřitelné zdroje, registr tvrzení, JSON-LD, Git"
# Čtvercová varianta pro platformy preferující 1:1 (WhatsApp, Telegram…):
# static/images/og-image-square.jpg (1200×1200) — stejný vizuál.

seo_type = "WebPage"
og_type = "website"
publisher = "vomaste.cz"

index = true
