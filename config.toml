# Custom doména aktivní od 2026-07-29: Route 53 (zóna Z04329971W28TTV7BWJ0M)
# míří apex A/AAAA na GitHub Pages a www CNAME na korczis.github.io;
# static/CNAME drží doménu při workflow deployi (bez něj by ji Pages
# resetly). get_url() generuje absolutní URL z této hodnoty.
base_url = "https://vomaste.cz"

title = "vomaste.cz"
description = "Neutrální, zdroji podložený přehled veřejně řešených kauz kolem veřejných osob."

compile_sass = false
build_search_index = false
generate_robots_txt = true
generate_feeds = false

minify_html = true
hard_link_static = false

taxonomies = []

[link_checker]
# irozhlas.cz returns 403 to Zola's link-checker user agent (bot-blocking),
# not because the article is gone — skip automated verification for it.
skip_prefixes = ["https://www.irozhlas.cz/"]

[extra]
locale = "cs_CZ"
lang = "cs"

# SVG so it needs no build step / rasterizer; note that Facebook/LinkedIn
# don't render SVG og:image previews (Twitter/X, Slack, Discord do) — swap
# for a rendered PNG/JPG at the same dimensions if those platforms matter.
og_image = "images/og-image.svg"
og_image_width = 1200
og_image_height = 630
og_image_type = "image/svg+xml"

seo_type = "WebPage"
og_type = "website"
publisher = "vomaste.cz"

index = true
