{#- Secondary sidebar (T-012, application shell master prompt §6.2/§10-13).

    The primary sidebar (templates/base.html) nests every dossier's full
    registry subtree inline — correct for the no-JS <noscript> fallback and
    for the JSON-LD SiteNavigationElement export, but exactly the "sidebar
    mixes global nav with each dossier's hierarchy" problem the master
    prompt names. This partial is an ADDITIVE second column, not a
    replacement: it renders ONLY the current dossier's own registries, read
    from data/generated/navigation-secondary.json (T-011) — a real second
    data provider, not a second copy of navigation.json's tree.

    Desktop-only (lg+) by design: two docked 16rem columns is real estate
    a phone or tablet viewport does not have, and the existing drawer +
    <noscript> fallback in base.html already reach every registry from the
    primary tree, so nothing is unreachable without this panel — it is a
    progressive enhancement, not the only path to a registry.

    Call with `dossier_slug` = page.extra.dossier or section.extra.dossier
    (empty string when not inside a dossier — the macro then renders
    nothing and the caller should not reserve layout space for it). -#}
{%- macro render(dossier_slug, current_path) -%}
{%- if dossier_slug %}
  {%- set secondary = load_data(path="data/generated/navigation-secondary.json") %}
  {%- set entry = secondary[dossier_slug] | default(value=false) %}
  {%- if entry and entry.registries | length > 0 %}
<aside id="secondary-sidebar" aria-labelledby="secondary-sidebar-heading"
       class="fixed inset-y-0 left-64 z-30 hidden w-64 border-r border-white/10 bg-black pt-16 lg:block">
  <nav aria-label="Registry dossieru {{ entry.title }}" class="h-full overflow-y-auto py-3">
    <p id="secondary-sidebar-heading" class="px-4 pb-2 pt-1 text-xs font-semibold uppercase tracking-wide text-white/55">
      {{ entry.title }}
    </p>
    <a href="{{ get_url(path="@/dossiers/" ~ dossier_slug ~ "/_index.md") | safe }}"
       class="flex items-center gap-3 px-4 py-2 text-sm text-white/60 hover:bg-white/5 hover:text-white{% if current_path == "/dossiers/" ~ dossier_slug ~ "/" %} bg-white/5 text-[#f3e5c0]{% endif %}">
      {{ entry.overviewLabel }}
    </a>
    {%- for reg in entry.registries %}
    <a href="{{ reg.route | safe }}"
       class="flex items-center gap-3 px-4 py-2 text-sm text-white/60 hover:bg-white/5 hover:text-white{% if current_path is starting_with(reg.route) %} bg-white/5 text-[#f3e5c0]{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><path d="{{ reg.icon }}"/></svg>
      <span class="min-w-0 flex-1 truncate">{{ reg.label }}</span>
      {%- if reg.count is number %}
      <span class="rounded-full bg-white/5 px-1.5 py-0.5 text-[0.7rem] tabular-nums text-white/50">{{ reg.count }}</span>
      {%- endif %}
    </a>
    {%- endfor %}
  </nav>
</aside>
  {%- endif %}
{%- endif %}
{%- endmacro render -%}
