name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dossier registry
        run: npm run validate:dossier

      - name: Validate relationship graph
        run: npm run validate:graph

      - name: Validate authorization scope
        run: npm run validate:authorization

      - name: Validate entity/aggregate dossier types
        run: npm run validate:dossier-types

      - name: Build route manifest
        run: npm run build:routes

      - name: Validate primary navigation
        run: npm run validate:navigation

      - name: Generate dossier stats
        run: npm run generate:stats

      - name: Build global content graph
        run: npm run build:global-graph

      - name: Build search index
        run: npm run build:search-index

      - name: Generate authorization-candidates report (not published)
        run: npm run generate:candidates

      - name: Update discovery log (not published)
        run: npm run generate:discovery-log

      - name: Build CSS
        run: npm run css:build

      - name: Build JS
        run: npm run js:build

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Check templates and internal links
        run: zola check

      - name: Build site
        run: zola build

      - name: Verify anchors
        run: npm run verify:anchors

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
