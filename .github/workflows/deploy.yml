name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build pipeline is defined ONCE, in package.json's `build` script.
      # This job used to re-list every step by hand, which silently drifted:
      # steps added to `npm run build` (JSON-LD exports, the schema gate, the
      # source-independence gate) never ran here, so /data/*.jsonld 404'd in
      # production while passing locally. Calling `npm run build` is the fix —
      # scripts/ci/check-workflow-parity.mjs fails if this ever drifts again.
      #
      # Zola is installed before the build because `npm run build` invokes it.
      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Check templates and internal links
        run: zola check

      - name: Full build (all validators, generators, exports and verifiers)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
