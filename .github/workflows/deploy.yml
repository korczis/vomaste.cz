name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build pipeline is defined ONCE, in package.json's `build` script.
      # This job used to re-list every step by hand, which silently drifted:
      # steps added to `npm run build` (JSON-LD exports, the schema gate, the
      # source-independence gate) never ran here, so /data/*.jsonld 404'd in
      # production while passing locally. Calling `npm run build` is the fix —
      # scripts/ci/check-workflow-parity.mjs fails if this ever drifts again.
      #
      # Zola is installed before the build because `npm run build` invokes it.
      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.3

      - name: Check templates and internal links
        run: zola check

      - name: Full build (all validators, generators, exports and verifiers)
        run: npm run build

      # Prohlížečové testy běží AŽ PO buildu a PŘED nahráním artefaktu:
      # potřebují hotové public/ a jejich smyslem je nepustit ven build,
      # ve kterém nefunguje řazení, filtr nebo přístupnost. Nejsou součástí
      # `npm run build` schválně — plný build je předcommitová brána a
      # prodlužovat ho o prohlížeč by zdražilo každý commit, který se
      # HTML netýká.
      #
      # Chrome se instaluje explicitně: Playwright na macOS 13 (vývojářský
      # stroj) odmítá stáhnout vlastní build, takže konfigurace používá
      # systémový prohlížeč přes `channel`. Aby se CI chovalo stejně jako
      # lokál, instaluje se i tady Chrome, ne Playwright chromium.
      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome

      - name: Browser tests (interakce, přístupnost, mobilní viewport)
        run: npm run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
